{{ if (.OutputFormats.Get "rss").Permalink }}
    <li><a href="{{ (.OutputFormats.Get "rss").Permalink }}" type="application/rss+xml" target="_blank" title="RSS" class="fa fa-rss"></a></li>
{{ else }}
    <li><a href="{{ .Site(.OutputFormats.Get "rss").Permalink }}" type="application/rss+xml" target="_blank" title="RSS" class="fa fa-rss"></a></li>
{{ end }}
